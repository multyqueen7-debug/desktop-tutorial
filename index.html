<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>비례식 · 한 화면씩 천천히</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#1c3340;font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.8}main{max-width:760px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:#516878}article{background:white;border-radius:22px;padding:30px;margin:16px 0;min-height:460px;border:1px solid #d6e2e8}h1{font-size:28px;line-height:1.5;margin:8px 0 25px}p{font-size:21px;margin:18px 0}.small{font-size:16px;color:#526674}.visual{font-size:30px;text-align:center;background:#edf7f3;border-radius:14px;padding:20px;line-height:1.9}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.4;margin:0 8px}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px}.frac>span:last-child{padding:0 8px}.outer{border:3px solid #197563;border-radius:50%;padding:0 9px}.inner{border-bottom:4px solid #bc6a15;padding:0 9px}.note{background:#fff8da;border-radius:12px;padding:24px;font-size:22px}button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#146b5a;color:white}button.secondary{background:#dfeaf0;color:#1c3340}button:disabled{opacity:.4;cursor:default}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}input{font:inherit;padding:10px;border:2px solid #99adba;border-radius:9px;max-width:100%;color:#1c3340}.answer{font-size:24px;display:block;width:100%;margin:20px 0}.fracinput{display:flex;flex-direction:column;align-items:center;margin:20px 0}.fracinput input{width:110px;text-align:center;font-size:25px}.bar{width:120px;border-top:3px solid #1c3340;margin:7px 0}details{background:#fff5d9;padding:12px;border-radius:10px;margin:16px 0}summary{cursor:pointer;font-size:18px}details p{font-size:19px}#feedback{font-size:20px;color:#17614d}#save{font-size:14px;color:#526674}progress{width:100%;height:8px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ca8a04;outline-offset:3px}@media(max-width:520px){article{padding:20px}h1{font-size:24px}p{font-size:20px}.visual{font-size:25px}.nav button{padding:10px}} </style><main><header><span>비례식 · 40분</span><span id="stage"></span></header><progress id="progress"></progress><article id="card"></article><div class="nav"><button id="prev" class="secondary">← 이전</button><span id="page" aria-live="polite"></span><button id="next">다음 →</button></div><div class="controls"><button id="notebook" class="secondary">공책 정리로 이동</button><button id="download" class="secondary">내 공부 기록 저장</button><button id="reset" class="secondary">처음부터</button></div><p id="save" role="status"></p><p class="small">공부한 답은 이 브라우저에만 저장돼요. 선생님께 자동 제출되지 않아요.</p></main><script>const slides=[{"title": "오늘은 하나씩, 천천히!", "body": "<p>한 화면에서 <b>한 가지</b>만 공부해요.</p><p>읽고 이해했으면 다음으로 넘겨요.<br>문제가 어려우면 힌트를 먼저 봐도 좋아요.</p><p>개념 이해 → 교과서 → 익힘 → 공책 → 선생님 검사</p><p class=\"small\">준비물: 교과서 82~83쪽, 익힘 54~55쪽, 공책, 연필<br>40분 중 개념 12분 · 교과서 10분 · 익힘 10분 · 공책 4분 · 검사 4분</p>", "stage": "개념 이해"}, {"title": "비는 두 양을 비교하는 말이에요", "body": "<p>주스에 <b>원액 2컵</b>과 <b>물 3컵</b>을 넣어요.</p><div class=\"visual\">원액 🟠 🟠<br>물 🔵 🔵 🔵</div><p>원액의 양과 물의 양의 비는 <b>2 : 3</b>이에요.<br>“2 대 3”이라고 읽어요.</p>", "stage": "개념 이해"}, {"title": "순서를 지켜요", "body": "<p><b>원액 : 물</b>은 <b>2 : 3</b>이에요.</p><p>앞에는 원액, 뒤에는 물의 양을 써요.</p><p>순서를 바꿔 <b>물 : 원액</b>으로 쓰면 <b>3 : 2</b>예요.</p>", "stage": "개념 이해"}, {"title": "비율은 앞의 수 ÷ 뒤의 수", "body": "<p>2 : 3의 비율은 <b>2 ÷ 3</b>이에요.</p><div class=\"visual\">2 : 3 → <span class=\"frac\"><span>2</span><span>3</span></span></div><p>앞의 수 2는 분자(위),<br>뒤의 수 3은 분모(아래)에 써요.</p>", "stage": "개념 이해"}, {"title": "가로선 위와 아래에 써 봐요", "body": "<p><b>2 : 5</b>의 비율을 분수로 써요.</p>", "answer": ["2/5"], "hint": "앞의 2는 위에, 뒤의 5는 아래에 써요.", "solution": "위에 2, 아래에 5를 써요.", "stage": "개념 연습", "fraction": true}, {"title": "같은 맛으로 두 배 만들어요", "body": "<p>처음에는 원액 2컵, 물 3컵이에요.</p><p>두 배 만들 때는 <b>원액도 2배, 물도 2배</b> 넣어요.</p><div class=\"visual\">2 : 3<br>↓ 둘 다 ×2<br>4 : 6</div><p>양은 늘어났지만 섞는 비율은 같아요.</p>", "stage": "개념 이해"}, {"title": "비율이 같은지 확인해요", "body": "<div class=\"visual\">2 : 3 → <span class=\"frac\"><span>2</span><span>3</span></span><br>4 : 6 → <span class=\"frac\"><span>4 ÷ 2 = 2</span><span>6 ÷ 2 = 3</span></span></div><p>두 번째 분수의 위아래를 2로 나누면<br>첫 번째 분수와 같아져요. <b>두 비율은 같아요.</b></p>", "stage": "개념 이해"}, {"title": "같은 비율을 =로 연결해요", "body": "<p>2 : 3과 4 : 6은 비율이 같아요.</p><div class=\"visual\">2 : 3 <b>=</b> 4 : 6</div><p>비율이 같은 두 비를 <b>=</b>로 연결한 식을<br><b>비례식</b>이라고 해요.</p><p class=\"small\">숫자 네 개가 같다는 뜻이 아니라, 두 비율이 같다는 뜻이에요.</p>", "stage": "개념 이해"}, {"title": "외항은 식의 양 끝이에요", "body": "<div class=\"visual\"><span class=\"outer\">2</span> : 3 = 4 : <span class=\"outer\">6</span></div><p>식 전체의 <b>바깥쪽</b> 두 수가 외항이에요.</p><p><b>외항 두 수를 직접 써 봐요.</b><br>두 수 사이에 쉼표를 넣어요.</p>", "stage": "개념 이해", "answer": ["2,6", "6,2"], "hint": "가장 왼쪽 수와 가장 오른쪽 수를 찾아요.", "solution": "외항은 2와 6이에요. 식 전체의 양 끝에 있어요."}, {"title": "내항은 식의 가운데예요", "body": "<div class=\"visual\">2 : <span class=\"inner\">3</span> = <span class=\"inner\">4</span> : 6</div><p>식 전체의 <b>안쪽</b> 두 수가 내항이에요.</p><p><b>내항 두 수를 직접 써 봐요.</b><br>두 수 사이에 쉼표를 넣어요.</p>", "stage": "개념 이해", "answer": ["3,4", "4,3"], "hint": "= 옆에 있는 가운데 두 수를 찾아요.", "solution": "내항은 3과 4예요. 식 전체의 가운데에 있어요."}, {"title": "양쪽에 같은 계산을 해요", "body": "<div class=\"visual\">2 : 3 → 4 : 6<br>앞도 ×2, 뒤도 ×2</div><p>앞과 뒤에 <b>0이 아닌 같은 수</b>를 곱하면 비율이 같아요.</p><p>같은 수로 나눌 때도 비율이 같아요.<br>4 : 6의 앞뒤를 2로 나누면 2 : 3이에요.</p>", "stage": "개념 이해"}, {"title": "더하기와 곱하기는 달라요", "body": "<p>2 : 3에 둘 다 2를 더하면 4 : 5예요.</p><p>원액은 2배가 됐지만 물은 2배가 아니에요.<br><b>같은 맛의 비율이 아니에요.</b></p><p>비율을 유지하려면 앞뒤에<br><b>같은 수를 곱하거나 나눠요.</b></p>", "stage": "개념 이해"}, {"title": "교과서 82쪽 · 신발 두 켤레", "body": "<p>한 켤레에 페트병 <b>6개</b>가 필요해요.</p><p>두 켤레에는 페트병이 몇 개 필요할까요?</p>", "answer": ["12"], "hint": "신발이 2배이니 페트병도 2배예요. 6 × 2를 해요.", "solution": "6 × 2 = 12개예요.", "stage": "교과서 문제", "fraction": false}, {"title": "교과서 82쪽 · 나무껍질", "body": "<p>한 켤레에 나무껍질 <b>20 g</b>이 필요해요.</p><p>두 켤레에는 몇 g이 필요할까요?</p>", "answer": ["40"], "hint": "20을 2배 해요.", "solution": "20 × 2 = 40 g이에요.", "stage": "교과서 문제", "fraction": false}, {"title": "교과서 82쪽 · 비례식 완성", "body": "<div class=\"visual\">6 : 20 = 12 : 40</div><p>앞도 뒤도 2배가 되었어요.<br>비율이 같아서 =로 연결할 수 있어요.</p><p><b>교과서 82쪽 표와 비례식에 써 넣어요.</b><br>비율은 둘 다 <span class=\"frac\"><span>3</span><span>10</span></span>이에요.</p>", "stage": "교과서 문제"}, {"title": "교과서 83쪽 2번 · 외항", "body": "<div class=\"visual\">3 : 8 = 12 : 32</div><p>외항 두 수를 써요. 예: 2, 6</p>", "answer": ["3,32", "32,3"], "hint": "식 전체의 양 끝을 찾아요.", "solution": "외항은 3과 32예요.", "stage": "교과서 문제", "fraction": false}, {"title": "교과서 83쪽 2번 · 내항", "body": "<div class=\"visual\">3 : 8 = 12 : 32</div><p>내항 두 수를 써요.</p>", "answer": ["8,12", "12,8"], "hint": "= 옆의 가운데 두 수예요.", "solution": "내항은 8과 12예요.", "stage": "교과서 문제", "fraction": false}, {"title": "교과서 83쪽 2번 · 하나 더", "body": "<div class=\"visual\">24 : 16 = 3 : 2</div><p>이 식의 <b>외항 두 수</b>를 써요.</p>", "stage": "교과서 문제", "answer": ["24,2", "2,24"], "hint": "식 전체의 양 끝을 찾아요.", "solution": "외항은 24와 2예요. 교과서에서 ○를 해요."}, {"title": "교과서 83쪽 2번 · 내항도 찾기", "body": "<div class=\"visual\">24 : 16 = 3 : 2</div><p>이 식의 <b>내항 두 수</b>를 써요.</p>", "answer": ["16,3", "3,16"], "hint": "가운데 두 수를 찾아요.", "solution": "내항은 16과 3이에요. 교과서에서 △를 해요.", "stage": "교과서 문제"}, {"title": "교과서 83쪽 3번 · 같은 배수", "body": "<div class=\"visual\">2 : 9 = 12 : □</div><p>2를 12로 만들려면 <b>6배</b> 해요.<br>9도 6배 하면 얼마일까요?</p>", "answer": ["54"], "hint": "9 × 6을 계산해요.", "solution": "9 × 6 = 54. 2 : 9 = 12 : 54예요.", "stage": "교과서 문제", "fraction": false}, {"title": "교과서 83쪽 3번 · 같은 나눗셈", "body": "<div class=\"visual\">10 : 6 = □ : 3</div><p>6을 3으로 만들려면 <b>2로 나눠요.</b><br>10도 2로 나누면 얼마일까요?</p>", "answer": ["5"], "hint": "10 ÷ 2를 계산해요.", "solution": "10 ÷ 2 = 5. 10 : 6 = 5 : 3이에요.", "stage": "교과서 문제", "fraction": false}, {"title": "소수의 비 · 소수점을 없애요", "body": "<p>비 <b>1.6 : 1.4</b>를 자연수의 비로 바꿔 봐요.</p><p>앞뒤에 <b>10을 곱하면</b> 소수점이 없어져요.</p><div class=\"visual\">1.6 × 10 = 16<br>1.4 × 10 = 14</div><p>앞과 뒤에 같은 계산을 해야 비율이 같아요.</p>", "stage": "교과서 문제"}, {"title": "소수의 비 · 첫 번째 변환", "body": "<div class=\"visual\">1.6 : 1.4 → □ : □</div><p>앞뒤에 10을 곱한 비를 써요.<br>비는 <b>16 : 14</b>처럼 :를 넣어 써요.</p>", "answer": ["16:14"], "hint": "1.6 × 10과 1.4 × 10을 각각 계산해요.", "solution": "16 : 14예요. 두 수 모두 자연수가 되었어요.", "stage": "교과서 문제"}, {"title": "소수의 비 · 더 간단하게", "body": "<div class=\"visual\">16 : 14 → □ : □</div><p>앞뒤를 <b>2로 나누면</b> 어떤 비가 되나요?</p>", "answer": ["8:7"], "hint": "16 ÷ 2 = 8이에요. 14도 2로 나눠요.", "solution": "8 : 7이에요. 1.6 : 1.4와 비율이 같아요.", "stage": "교과서 문제"}, {"title": "분수의 비 · 분모를 없애요", "body": "<div class=\"visual\"><span class=\"frac\"><span>1</span><span>8</span></span> : <span class=\"frac\"><span>1</span><span>7</span></span></div><p>분모 8과 7의 공배수인 <b>56</b>을<br>앞뒤에 곱해 자연수로 바꿔요.</p><p>56은 8로도, 7로도 나누어떨어져요.<br>56 = 8 × 7이에요.</p>", "stage": "교과서 문제"}, {"title": "분수의 비 · 앞의 수부터", "body": "<div class=\"visual\"><span class=\"frac\"><span>1</span><span>8</span></span> × 56 = □</div><p>56을 8로 나누면 얼마인가요?</p>", "answer": ["7"], "hint": "56 ÷ 8을 계산해요.", "solution": "7이에요. 8분의 1에 56을 곱하면 56 ÷ 8 = 7이에요.", "stage": "교과서 문제"}, {"title": "분수의 비 · 뒤의 수도", "body": "<div class=\"visual\"><span class=\"frac\"><span>1</span><span>7</span></span> × 56 = □</div><p>56을 7로 나누면 얼마인가요?</p>", "answer": ["8"], "hint": "앞과 똑같이 56을 곱해요. 56 ÷ 7을 계산해요.", "solution": "8이에요. 7분의 1에 56을 곱하면 56 ÷ 7 = 8이에요.", "stage": "교과서 문제"}, {"title": "분수의 비 · 자연수의 비로 쓰기", "body": "<p>앞의 수는 <b>7</b>, 뒤의 수는 <b>8</b>이 되었어요.</p><div class=\"visual\"><span class=\"frac\"><span>1</span><span>8</span></span> : <span class=\"frac\"><span>1</span><span>7</span></span> → □ : □</div><p>바뀐 비를 써요. 앞뒤 순서를 지켜요.</p>", "answer": ["7:8"], "hint": "앞에 7, 뒤에 8을 써요.", "solution": "7 : 8이에요. 8 : 7과는 순서가 다르므로 비율도 달라요.", "stage": "교과서 문제"}, {"title": "자연수의 비 · 간단하게 바꾸기", "body": "<div class=\"visual\">24 : 28 → □ : □</div><p>앞뒤를 <b>4로 나누어</b> 비를 써요.</p>", "answer": ["6:7"], "hint": "24 ÷ 4와 28 ÷ 4를 각각 계산해요.", "solution": "6 : 7이에요.", "stage": "교과서 문제"}, {"title": "네 비를 비교해요 · 같은 짝 찾기", "body": "<p>① <b>8 : 7</b> → 8 : 7<br>② <span class=\"frac\"><span>1</span><span>8</span></span> : <span class=\"frac\"><span>1</span><span>7</span></span> → 7 : 8<br>③ <b>1.6 : 1.4</b> → 8 : 7<br>④ <b>24 : 28</b> → 6 : 7</p><p>비율이 같은 두 비의 <b>번호</b>를 써요.<br>예: 1, 2</p>", "answer": ["1,3", "3,1", "①,③", "③,①"], "hint": "바뀐 비가 똑같은 두 줄을 찾아요. 앞뒤 순서도 같아야 해요.", "solution": "①과 ③이에요. 둘 다 8 : 7로 나타낼 수 있어요.", "stage": "교과서 문제"}, {"title": "교과서 83쪽 4번 · 내 비례식 쓰기", "body": "<p>비율이 같은 두 비는<br><b>8 : 7</b>과 <b>1.6 : 1.4</b>였어요.</p><p>두 비 사이에 <b>=</b>를 넣어 비례식을 써요.<br>교과서에도 같은 답을 써요.</p>", "answer": ["8:7=1.6:1.4", "1.6:1.4=8:7"], "hint": "8 : 7 = 로 시작하고, 오른쪽에 1.6 : 1.4를 써요.", "solution": "8 : 7 = 1.6 : 1.4예요. 비율이 같은 두 비를 연결했어요.", "stage": "교과서 문제"}, {"title": "익힘 54쪽 1번 · 비율", "body": "<p><b>2 : 5</b>의 비율을 분수로 써요.</p>", "answer": ["2/5"], "hint": "앞은 위, 뒤는 아래에 써요.", "solution": "분자는 2, 분모는 5예요.", "stage": "익힘 문제", "fraction": true}, {"title": "익힘 54쪽 1번 · 두 번째 비율", "body": "<p><b>10 : 25</b>의 비율을 분수로 써요.</p>", "answer": ["10/25", "2/5"], "hint": "앞의 수는 분자, 뒤의 수는 분모예요.", "solution": "10/25예요. 위아래를 5로 나누면 2/5가 돼요.", "fraction": true, "stage": "익힘 문제"}, {"title": "익힘 54쪽 1번 · 두 비율 비교", "body": "<p>앞에서 구한 <b>2 : 5</b>와 <b>10 : 25</b>의 비율을 비교해요.</p><p>같으면 <b>같다</b>, 다르면 <b>다르다</b>를 써요.</p>", "answer": ["같다"], "hint": "10/25의 위아래를 5로 나누어 2/5와 비교해요.", "solution": "두 비율은 같아요. 10/25 = 2/5예요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 54쪽 1번 · 비례식 쓰기", "body": "<p><b>2 : 5</b>와 <b>10 : 25</b>로 비례식을 써요.</p><p>두 비 사이에 =를 넣어요.</p>", "answer": ["2:5=10:25", "10:25=2:5"], "hint": "두 비의 순서는 그대로 두고 사이에 =를 써요.", "solution": "2 : 5 = 10 : 25예요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 54쪽 2번 · 곱하기", "body": "<div class=\"visual\">6 : 11 = 18 : □</div><p>6에서 18은 <b>3배</b>예요.<br>11도 3배 하면 얼마일까요?</p>", "answer": ["33"], "hint": "11 × 3을 해요.", "solution": "33이에요. 화살표와 문장에는 3, 빈칸에는 33을 써요.", "stage": "익힘 문제", "fraction": false}, {"title": "익힘 54쪽 2번 · 나누기", "body": "<div class=\"visual\">30 : 45 = □ : 3</div><p>45를 <b>15로 나누면</b> 3이에요.<br>30도 15로 나누면 얼마일까요?</p>", "answer": ["2"], "hint": "30 ÷ 15를 해요.", "solution": "2예요. 화살표와 문장에는 15, 빈칸에는 2를 써요.", "stage": "익힘 문제", "fraction": false}, {"title": "익힘 55쪽 3번 · 외항", "body": "<div class=\"visual\">3 : 10 = 12 : 40</div><p>양 끝의 두 수는 무엇인가요?</p>", "answer": ["3,40", "40,3"], "hint": "가장 왼쪽과 가장 오른쪽을 봐요.", "solution": "외항은 3과 40이에요.", "stage": "익힘 문제", "fraction": false}, {"title": "익힘 55쪽 3번 · 내항", "body": "<div class=\"visual\">3 : 10 = 12 : 40</div><p>가운데의 두 수는 무엇인가요?</p>", "answer": ["10,12", "12,10"], "hint": "= 옆에 있는 두 수를 봐요.", "solution": "내항은 10과 12예요.", "stage": "익힘 문제", "fraction": false}, {"title": "익힘 55쪽 4번 · 먼저 외항 찾기", "body": "<div class=\"visual\">14 : 12 = 7 : 6</div><p>양 끝의 두 수를 써요.</p>", "answer": ["14,6", "6,14"], "hint": "가장 왼쪽과 가장 오른쪽을 봐요.", "solution": "외항은 14와 6이에요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 55쪽 4번 · 헷갈림 풀기", "body": "<div class=\"visual\">14 : 12 = 7 : 6</div><p>잘못 설명한 것은 어느 것인가요?</p><p>㉠ 두 비의 비율은 같아요.<br>㉡ 외항은 14와 7이에요.</p><p>㉠ 또는 ㉡을 써요.</p>", "stage": "익힘 문제", "answer": ["㉡", "ㄴ"], "hint": "외항은 식 전체의 양 끝이에요.", "solution": "㉡이에요. 외항은 14와 6, 내항은 12와 7이에요."}, {"title": "익힘 55쪽 5번 · 첫 번째 비율", "body": "<p><b>8 : 10</b>의 비율을 분수로 써요.</p>", "answer": ["8/10", "4/5"], "hint": "8/10을 쓰거나 약분해요.", "solution": "8/10 = 4/5예요.", "fraction": true, "stage": "익힘 문제"}, {"title": "익힘 55쪽 5번 · 두 번째 비율", "body": "<p><b>16 : 12</b>의 비율을 분수로 써요.</p>", "answer": ["16/12", "4/3"], "hint": "16/12를 쓰거나 약분해요.", "solution": "16/12 = 4/3예요.", "fraction": true, "stage": "익힘 문제"}, {"title": "익힘 55쪽 5번 · 세 번째 비율", "body": "<p><b>4 : 5</b>의 비율을 분수로 써요.</p>", "answer": ["4/5"], "hint": "앞의 수는 위, 뒤의 수는 아래에 써요.", "solution": "4/5예요.", "fraction": true, "stage": "익힘 문제"}, {"title": "익힘 55쪽 5번 · 같은 짝 찾기", "body": "<p>① 8 : 10<br>② 16 : 12<br>③ 4 : 5</p><p>앞에서 구한 비율을 비교해요.<br>비율이 같은 두 비의 번호를 써요.</p>", "answer": ["1,3", "3,1", "①,③", "③,①"], "hint": "각 분수를 약분하고, 값이 같은 두 개를 찾아요.", "solution": "①과 ③이에요. 두 비율은 모두 4/5예요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 55쪽 5번 · 비례식 쓰기", "body": "<p>① 8 : 10<br>② 16 : 12<br>③ 4 : 5</p><p>내가 찾은 두 비를 =로 연결해요.</p>", "answer": ["8:10=4:5", "4:5=8:10"], "hint": "앞에서 고른 두 비를 그대로 써요. 사이에 =를 넣어요.", "solution": "8 : 10 = 4 : 5예요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 55쪽 6번 · 한 번 더 연습", "body": "<div class=\"visual\">5 : 3 = 15 : □</div><p>5에서 15는 <b>3배</b>예요.<br>3도 3배 하면 얼마일까요?</p>", "answer": ["9"], "hint": "3 × 3을 계산해요.", "solution": "9예요. 비의 앞뒤에 3을 곱했어요. 비율도 같아요.", "stage": "익힘 문제", "fraction": false}, {"title": "익힘 55쪽 6번 · 규민의 방법", "body": "<div class=\"visual\">5 : 3 → 15 : □</div><p>5를 15로 바꿀 때 <b>몇 배</b> 했나요?</p>", "answer": ["3"], "hint": "15 ÷ 5를 계산해요.", "solution": "3배예요. 뒤의 3도 3배 하면 9가 돼요.", "fraction": false, "stage": "익힘 문제"}, {"title": "익힘 55쪽 6번 · 민하의 방법", "body": "<p>첫 번째 비율은 <span class=\"frac\"><span>5</span><span>3</span></span>이에요.</p><p>분자를 15로 만들려면 위아래에 3을 곱해요.<br>그때 <b>분모</b>는 얼마가 되나요?</p>", "answer": ["9"], "hint": "분모 3에도 3을 곱해요.", "solution": "분모는 9예요. 5/3 = 15/9이므로 비율이 같아요.", "fraction": false, "stage": "익힘 문제"}, {"title": "선택 도전 · 오늘은 건너뛰어도 좋아요", "body": "<p>익힘 55쪽 마지막 문제예요.<br>시간이 남으면 도전해요.</p><p>비율은 <span class=\"frac\"><span>3</span><span>8</span></span>, 외항은 3과 56이에요.</p><div class=\"visual\">3 : 8 = □ : 56</div><p>□에 들어갈 수를 써요.</p>", "stage": "익힘 문제", "answer": ["21"], "hint": "8 → 56은 7배예요. 3도 7배 해요.", "solution": "21이에요. 3 : 8 = 21 : 56이에요."}, {"title": "공책 필기 ① 비례식의 뜻", "body": "<p>공책 제목: <b>비례식을 알아볼까요</b></p><div class=\"note\">비례식은 비율이 같은 두 비를<br>기호 =로 나타낸 식이다.<br><br>예: 2 : 3 = 4 : 6</div><p>실제 공책에 써요. 다 썼으면 다음으로!</p>", "stage": "공책 필기"}, {"title": "공책 필기 ② 외항과 내항", "body": "<div class=\"note\">2 : 3 = 4 : 6<br><br>외항: 양 끝의 2와 6<br>내항: 가운데의 3과 4</div><p>공책에서 외항에 ○,<br>내항에 밑줄을 그어요.</p>", "stage": "공책 필기"}, {"title": "공책 필기 ③ 만드는 방법", "body": "<div class=\"note\">비의 앞과 뒤에 0이 아닌 같은 수를<br>곱하거나 나누면 비율이 같다.<br><br>2 : 3의 앞뒤에 2를 곱하면 4 : 6이다.</div><p>공책에 쓰고, “앞뒤에 같은 계산!”이라고 읽어요.</p>", "stage": "공책 필기"}, {"title": "내 힘으로 마지막 확인", "body": "<div class=\"visual\">4 : 7 = 12 : □</div><p>4에서 12는 3배예요.<br>7도 3배 하면 얼마일까요?</p>", "answer": ["21"], "hint": "7 × 3을 계산해요.", "solution": "21이에요. 4 : 7 = 12 : 21. 앞뒤에 같은 수를 곱했어요.", "stage": "공책 필기", "fraction": false}, {"title": "선생님께 검사받아요", "body": "<p><b>교과서 82~83쪽과 공책을 펼쳐요.</b><br>익힘도 함께 준비해요.</p><p>선생님께 이렇게 말해요.<br>“비례식은 비율이 같은 두 비를 =로 나타낸 식이에요.”</p><p>공책의 2 : 3 = 4 : 6에서<br>외항과 내항을 손가락으로 짚어 보여 드려요.</p><p>모르는 곳은 “여기를 도와주세요”라고 말해요.<br>검사받고, 알려 주신 부분을 고쳐요.</p><label><input id=\"inspected\" type=\"checkbox\"> 선생님께 검사받았어요.</label>", "stage": "선생님 검사"}];const key='proportion-simple-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}let page=Number.isInteger(state.page)?Math.max(0,Math.min(state.page,slides.length-1)):0;function save(){state.page=page;try{localStorage.setItem(key,JSON.stringify(state));document.querySelector('#save').textContent='자동 저장됨 · 같은 브라우저에서 이어 공부할 수 있어요.'}catch(e){document.querySelector('#save').textContent='자동 저장을 사용할 수 없어요. 공부 기록을 내려받아 보관해요.'}}function mathText(el,text){text.split(/(\d+\/\d+)/g).forEach(part=>{if(/^\d+\/\d+$/.test(part)){const f=document.createElement('span');f.className='frac';const pair=part.split('/');pair.forEach(v=>{const sp=document.createElement('span');sp.textContent=v;f.append(sp)});el.append(f)}else el.append(document.createTextNode(part))})}function normalize(v){return v.replace(/\s/g,'').replace(/[，、]/g,',').replace(/：/g,':').replace(/＝/g,'=')}function render(){const s=slides[page];const card=document.querySelector('#card');card.innerHTML='<h1></h1>'+s.body;card.querySelector('h1').textContent=s.title;document.querySelector('#stage').textContent=s.stage;document.querySelector('#page').textContent=(page+1)+' / '+slides.length;document.querySelector('#progress').max=slides.length;document.querySelector('#progress').value=page+1;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===slides.length-1;if(s.answer){const box=document.createElement('div');let inputs=[];if(s.fraction){box.className='fracinput';for(let i=0;i<2;i++){const input=document.createElement('input');input.inputMode='numeric';input.placeholder=i?'분모':'분자';input.setAttribute('aria-label',i?'분모':'분자');input.value=(state['q'+page]||'').split('/')[i]||'';inputs.push(input);box.append(input);if(i===0){const bar=document.createElement('div');bar.className='bar';box.append(bar)}}}else{const input=document.createElement('input');input.className='answer';input.placeholder='답을 입력해요';input.setAttribute('aria-label','답');input.value=state['q'+page]||'';inputs=[input];box.append(input)}const get=()=>inputs.map(i=>i.value.trim()).join(s.fraction?'/':'');const hint=document.createElement('details');const summary=document.createElement('summary');summary.textContent='도움이 필요해요 · 힌트';const hp=document.createElement('p');mathText(hp,s.hint);hint.append(summary,hp);const check=document.createElement('button');check.textContent='내 답 확인';const feedback=document.createElement('div');feedback.id='feedback';feedback.setAttribute('role','status');inputs.forEach(i=>i.oninput=()=>{state['q'+page]=get();save();feedback.replaceChildren()});check.onclick=()=>{if(inputs.some(i=>!i.value.trim())){feedback.textContent='빈칸에 답을 적어 봐요.';return}if(s.answer.some(a=>normalize(a)===normalize(get()))){feedback.replaceChildren();mathText(feedback,'✓ 잘했어요! '+s.solution);state['ok'+page]=true;save()}else{feedback.textContent='괜찮아요. 힌트를 보고 다시 해 봐요.';state['ok'+page]=false;save();const d=document.createElement('details');const sum=document.createElement('summary');sum.textContent='풀이를 함께 읽어요';const p=document.createElement('p');mathText(p,s.solution);d.append(sum,p);feedback.append(d)}};card.append(box,hint,check,feedback)}const inspected=card.querySelector('#inspected');if(inspected){inspected.checked=!!state.inspected;inspected.onchange=()=>{state.inspected=inspected.checked;save()}}save()}function move(n){page=Math.max(0,Math.min(n,slides.length-1));render();window.scrollTo({top:0,behavior:'smooth'})}document.querySelector('#next').onclick=()=>move(page+1);document.querySelector('#prev').onclick=()=>move(page-1);document.querySelector('#notebook').onclick=()=>move(slides.findIndex(s=>s.stage==='공책 필기'));document.querySelector('#reset').onclick=()=>{if(confirm('저장된 공부 기록을 지우고 처음부터 시작할까요?')){state={};move(0)}};document.querySelector('#download').onclick=()=>{const lines=['비례식 공부 기록'];slides.forEach((s,i)=>{if(s.answer)lines.push(s.title+': '+(state['q'+i]||'미입력')+(state['ok'+i]?' (정답 확인)':''))});lines.push('선생님 검사: '+(state.inspected?'완료 표시':'미검사'));const u=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='비례식_공부기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();</script></html>
