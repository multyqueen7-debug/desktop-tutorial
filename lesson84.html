<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>84~85쪽 · 비례식의 성질</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#1c3340;font-family:system-ui,'Malgun Gothic',sans-serif;line-height:1.8}main{max-width:760px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:#516878}article{background:white;border-radius:22px;padding:30px;margin:16px 0;min-height:460px;border:1px solid #d6e2e8}h1{font-size:28px;line-height:1.5;margin:8px 0 25px}p{font-size:21px;margin:18px 0}.small{font-size:16px;color:#526674}.visual{font-size:30px;text-align:center;background:#edf7f3;border-radius:14px;padding:20px;line-height:1.9}.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.4;margin:0 8px}.frac>span:first-child{border-bottom:2px solid currentColor;padding:0 8px}.frac>span:last-child{padding:0 8px}.outer{border:3px solid #197563;border-radius:50%;padding:0 9px}.inner{border-bottom:4px solid #bc6a15;padding:0 9px}.note{background:#fff8da;border-radius:12px;padding:24px;font-size:22px}button{font:inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:#146b5a;color:white}button.secondary{background:#dfeaf0;color:#1c3340}button:disabled{opacity:.4;cursor:default}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}input{font:inherit;padding:10px;border:2px solid #99adba;border-radius:9px;max-width:100%;color:#1c3340}.answer{font-size:24px;display:block;width:100%;margin:20px 0}.fracinput{display:flex;flex-direction:column;align-items:center;margin:20px 0}.fracinput input{width:110px;text-align:center;font-size:25px}.bar{width:120px;border-top:3px solid #1c3340;margin:7px 0}details{background:#fff5d9;padding:12px;border-radius:10px;margin:16px 0}summary{cursor:pointer;font-size:18px}details p{font-size:19px}#feedback{font-size:20px;color:#17614d}#save{font-size:14px;color:#526674}progress{width:100%;height:8px}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ca8a04;outline-offset:3px}@media(max-width:520px){article{padding:20px}h1{font-size:24px}p{font-size:20px}.visual{font-size:25px}.nav button{padding:10px}} </style><main><header><span>84~85쪽 · 비례식의 성질</span><span id="stage"></span></header><progress id="progress"></progress><article id="card"></article><div class="nav"><button id="prev" class="secondary">← 이전</button><span id="page" aria-live="polite"></span><button id="next">다음 →</button></div><div class="controls"><button id="student" class="secondary">학생 학습 시작</button><button id="workbook" class="secondary">익힘 문제로 이동</button><button id="notebook" class="secondary">공책 정리로 이동</button><button id="download" class="secondary">내 공부 기록 저장</button><button id="reset" class="secondary">처음부터</button></div><p id="save" role="status"></p><p class="small">화면을 넘길 때는 인터넷을 다시 사용하지 않아요. 공부한 답은 이 브라우저에만 저장돼요. 선생님께 자동 제출되지 않아요.</p></main><script>const slides=[{"title": "내일 공부 · 비례식의 성질", "body": "<p><b>교과서 84~85쪽 · 익힘 56~57쪽</b></p><p>목표: 외항의 곱과 내항의 곱이 같은 이유를 알고,<br>이 성질로 비례식의 빈칸을 구해요.</p><p>앞의 화면은 선생님과 함께 봐요.<br>“이제 내 힘으로!”가 나오면 스스로 풀어요.</p><p class=\"small\">40분: 복습 3분 + 교사 설명 7분 → 교과서 13분 + 익힘 10분 → 공책 4분 → 검사 3분<br>준비물: 교과서, 공책, 연필</p>", "stage": "교사 전체 설명"}, {"title": "오늘 내용 복습 ① 비례식의 뜻", "stage": "교사와 복습", "body": "<p>비례식은 두 비의 <b>비율이 같을 때</b><br>=로 연결한 식이에요.</p><div class=\"visual\">2 : 3 = 4 : 6</div><p>이 식의 두 비율은 같나요, 다른가요?<br><b>같다</b> 또는 <b>다르다</b>를 써요.</p>", "answer": ["같다"], "hint": "2 : 3의 앞뒤에 2를 곱하면 4 : 6이에요.", "solution": "비율은 같아요. 양이 달라도 비율이 같으면 비례식이에요."}, {"title": "오늘 내용 복습 ② 외항 찾기", "stage": "교사와 복습", "body": "<div class=\"visual\">2 : 3 = 4 : 6</div><p>식 전체의 <b>양 끝</b> 두 수를 써요.</p>", "answer": ["2,6", "6,2"], "hint": "가장 왼쪽과 가장 오른쪽을 봐요.", "solution": "외항은 2와 6이에요."}, {"title": "오늘 내용 복습 ③ 내항 찾기", "stage": "교사와 복습", "body": "<div class=\"visual\">2 : 3 = 4 : 6</div><p>식 전체의 <b>가운데</b> 두 수를 써요.</p>", "answer": ["3,4", "4,3"], "hint": "= 옆의 두 수를 찾아요.", "solution": "내항은 3과 4예요."}, {"title": "오늘 내용 복습 ④ 같은 비율 만들기", "stage": "교사와 복습", "body": "<div class=\"visual\">2 : 3 = 6 : □</div><p>2에서 6은 3배예요.<br>3도 3배 하면 얼마인가요?</p>", "answer": ["9"], "hint": "앞뒤에 같은 수를 곱해요. 3 × 3을 계산해요.", "solution": "9예요. 오늘은 같은 배수로 만들었어요. 내일은 외항과 내항의 곱을 살펴봐요."}, {"title": "함께 떠올리기 · 외항과 내항", "body": "<div class=\"visual\">1 : 4 = 6 : 24</div><p>선생님 질문: “식의 양 끝은 어떤 수인가요?”<br>“가운데는 어떤 수인가요?”</p><details><summary>학생들이 말한 뒤 확인하기</summary><p>외항은 1과 24, 내항은 4와 6이에요.<br>외항은 각 비의 앞 수가 아니라, 식 전체의 양 끝이에요.</p></details>", "stage": "교사 전체 설명"}, {"title": "84쪽 · 크레파스로 생각해요", "body": "<p>새 크레파스 1개에 헌 크레파스 4 g이 필요해요.<br>6개를 만들면 24 g이 필요해요.</p><div class=\"visual\">1 : 4 → 6 : 24<br>앞도 ×6, 뒤도 ×6</div><p>앞뒤에 같은 수를 곱했으므로 비율이 같아요.<br><b>1 : 4 = 6 : 24</b>로 쓸 수 있어요.</p>", "stage": "교사 전체 설명"}, {"title": "외항끼리 곱해 볼까요?", "body": "<div class=\"visual\"><span class=\"outer\">1</span> : 4 = 6 : <span class=\"outer\">24</span></div><p>선생님 질문: “양 끝의 두 수를 곱하면?”</p><details><summary>생각한 뒤 확인</summary><div class=\"visual\">1 × 24 = 24</div><p>이것이 외항의 곱이에요.</p></details>", "stage": "교사 전체 설명"}, {"title": "내항끼리 곱해 볼까요?", "body": "<div class=\"visual\">1 : <span class=\"inner\">4</span> = <span class=\"inner\">6</span> : 24</div><p>선생님 질문: “가운데 두 수를 곱하면?”</p><details><summary>생각한 뒤 확인</summary><div class=\"visual\">4 × 6 = 24</div><p>외항의 곱도 24, 내항의 곱도 24예요.</p></details>", "stage": "교사 전체 설명"}, {"title": "왜 두 곱이 같을까요?", "body": "<p>24는 <b>4 × 6</b>, 오른쪽 6은 <b>1 × 6</b>이에요.</p><div class=\"visual\">외항의 곱: 1 × (4 × 6)<br>내항의 곱: 4 × (1 × 6)</div><p>둘 다 <b>1, 4, 6</b>을 곱해요.<br>곱하는 순서가 달라도 곱은 같아요.</p><p>앞과 뒤에 같은 배수를 곱해 비례식을 만들었기 때문에 이런 관계가 생겨요.</p>", "stage": "교사 전체 설명"}, {"title": "오늘의 핵심 성질", "body": "<div class=\"note\">비례식에서<br><b>외항의 곱 = 내항의 곱</b></div><p>“양 끝끼리 곱한 값과 가운데끼리 곱한 값은 같아요.”</p><p class=\"small\">바로 옆 두 수끼리 곱하지 않아요. 외항 두 수, 내항 두 수를 각각 찾아요.</p>", "stage": "교사 전체 설명"}, {"title": "빈칸은 이렇게 찾아요", "body": "<div class=\"visual\">2 : 3 = □ : 12</div><p>① 외항의 곱: <b>2 × 12 = 24</b><br>② 내항의 곱도 24: <b>3 × □ = 24</b><br>③ 빈칸: <b>24 ÷ 3 = 8</b></p><p>곱할 수를 모를 때는 나눗셈으로 찾아요.</p><p class=\"small\">이 예시는 설명용이에요. 교과서 문제는 이제 스스로 풀어요.</p>", "stage": "교사 전체 설명"}, {"title": "답이 맞는지도 확인해요", "body": "<div class=\"visual\">2 : 3 = 8 : 12</div><p>외항: 2 × 12 = 24<br>내항: 3 × 8 = 24</p><p><b>두 곱이 같아요!</b></p><p>답을 식에 넣어 확인하면 계산 실수도 찾을 수 있어요.</p>", "stage": "교사 전체 설명"}, {"title": "이제 내 힘으로!", "body": "<p>지금부터는 <b>한 화면에 한 단계</b>씩 풀어요.</p><p>먼저 답 쓰기 → 필요하면 힌트 → 내 답 확인</p><p>틀려도 괜찮아요. 풀이를 읽고 다시 써 봐요.<br>화면에서 푼 답은 <b>교과서에도</b> 써 넣어요.</p><p class=\"small\">84쪽 1번부터 85쪽 4번까지 공부해요. 33분이 되면 공책 정리로 이동해요.</p>", "stage": "학생 스스로 학습"}, {"title": "84쪽 1번 · 비례식 쓰기", "body": "<p>새 크레파스 수 : 헌 크레파스양<br><b>1 : 4</b>와 <b>6 : 24</b>를 =로 연결해요.</p>", "answer": ["1:4=6:24", "6:24=1:4"], "hint": "두 비 사이에 =를 써요.", "solution": "1 : 4 = 6 : 24예요. 앞뒤에 6을 곱했어요.", "stage": "학생 스스로 학습"}, {"title": "84쪽 1번 · 같은 배수", "body": "<p>1 : 4에서 6 : 24로 바뀌었어요.<br>앞뒤에 곱한 수는 얼마인가요?</p>", "answer": ["6"], "hint": "1 × □ = 6이에요.", "solution": "앞뒤에 6을 곱했어요. 교과서의 곱셈 빈칸에도 6을 써요.", "stage": "학생 스스로 학습"}, {"title": "84쪽 1번 · 외항의 곱", "body": "<div class=\"visual\">1 : 4 = 6 : 24</div><p>외항의 곱 <b>1 × 24</b>를 구해요.</p>", "answer": ["24"], "hint": "양 끝을 곱해요.", "solution": "외항의 곱은 24예요.", "stage": "학생 스스로 학습"}, {"title": "84쪽 1번 · 내항의 곱", "body": "<div class=\"visual\">1 : 4 = 6 : 24</div><p>내항의 곱 <b>4 × 6</b>을 구해요.</p>", "answer": ["24"], "hint": "가운데 두 수를 곱해요.", "solution": "내항의 곱은 24예요.", "stage": "학생 스스로 학습"}, {"title": "84쪽 1번 · 두 곱 비교", "body": "<p>앞에서 구한 외항의 곱과 내항의 곱을 비교해요.</p><p><b>같다</b> 또는 <b>다르다</b>를 써요.</p>", "answer": ["같다"], "hint": "1 × 24와 4 × 6을 비교해요.", "solution": "두 곱은 같아요. 교과서의 곱셈식과 알게 된 점을 완성해요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 2번 · 비례식 완성", "body": "<div class=\"visual\">2 : 11 = □ : 33</div><p>앞뒤에 3을 곱해요.<br>2 × 3은 얼마인가요?</p>", "answer": ["6"], "hint": "2를 3배 해요.", "solution": "6이에요. 교과서에 2 : 11 = 6 : 33을 써요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 2번 · 외항의 곱", "body": "<div class=\"visual\">2 : 11 = 6 : 33</div><p>외항의 곱 <b>2 × 33</b>은?</p>", "answer": ["66"], "hint": "33을 2배 해요.", "solution": "외항의 곱은 66이에요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 2번 · 내항의 곱", "body": "<div class=\"visual\">2 : 11 = 6 : 33</div><p>내항의 곱 <b>11 × 6</b>은?</p>", "answer": ["66"], "hint": "11을 6배 해요.", "solution": "내항의 곱도 66이에요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 2번 · 이유도 설명해요", "body": "<p>2 : 11 = 2 × 3 : 11 × 3이에요.</p><div class=\"visual\">외항: 2 × (11 × 3)<br>내항: 11 × (2 × 3)</div><p>둘 다 같은 세 수를 곱해요.</p><p><b>공책이나 교과서에 한 줄로 써요.</b><br>“두 곱은 모두 2, 11, 3을 곱한 값이라 같습니다.”</p>", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 왼쪽 · 아는 곱부터", "body": "<div class=\"visual\">3 : 5 = □ : 15</div><p>외항의 곱 <b>3 × 15</b>는?</p>", "answer": ["45"], "hint": "15를 3배 해요.", "solution": "외항의 곱은 45예요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 왼쪽 · 같은 곱 만들기", "body": "<div class=\"visual\">3 : 5 = □ : 15</div><p>외항의 곱은 45예요.<br><b>5 × □ = 45</b>를 완성해요.</p>", "answer": ["9"], "hint": "□ = 45 ÷ 5예요.", "solution": "9예요. 3 : 5 = 9 : 15. 교과서의 내항의 곱 식은 5 × □ = 45예요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 왼쪽 · 확인하기", "body": "<div class=\"visual\">3 : 5 = 9 : 15</div><p>내항의 곱 <b>5 × 9</b>는?</p>", "answer": ["45"], "hint": "외항의 곱과 같은지 살펴봐요.", "solution": "45예요. 외항의 곱 3 × 15도 45로 같아요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 오른쪽 · 아는 곱부터", "body": "<div class=\"visual\">□ : 7 = 42 : 21</div><p>이번에는 내항의 곱을 먼저 구해요.<br><b>7 × 42</b>는?</p>", "answer": ["294"], "hint": "7 × 40과 7 × 2를 더해요.", "solution": "내항의 곱은 294예요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 오른쪽 · 빈칸 구하기", "body": "<div class=\"visual\">□ : 7 = 42 : 21</div><p>외항의 곱도 294여야 해요.<br><b>□ × 21 = 294</b>에서 □는?</p>", "answer": ["14"], "hint": "294 ÷ 21을 해요. 21 × 10 = 210, 남은 84는 21의 몇 배일까요?", "solution": "14예요. 14 : 7 = 42 : 21. 교과서에 외항의 곱 식도 써요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 3번 오른쪽 · 확인하기", "body": "<div class=\"visual\">14 : 7 = 42 : 21</div><p>외항의 곱 <b>14 × 21</b>은?</p>", "answer": ["294"], "hint": "14 × 20에 14를 더해요.", "solution": "294예요. 내항의 곱 7 × 42와 같아요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 4번 · ㉡ 먼저", "body": "<div class=\"visual\">20 : ㉠ = 4 : ㉡</div><p>외항의 곱은 100이에요.<br><b>20 × ㉡ = 100</b>에서 ㉡은?</p>", "answer": ["5"], "hint": "100 ÷ 20을 계산해요.", "solution": "㉡은 5예요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 4번 · ㉠ 구하기", "body": "<div class=\"visual\">20 : ㉠ = 4 : 5</div><p>내항의 곱도 100이에요.<br><b>㉠ × 4 = 100</b>에서 ㉠은?</p>", "answer": ["25"], "hint": "100 ÷ 4를 계산해요.", "solution": "㉠은 25예요. 교과서에 ㉠ = 25, ㉡ = 5를 써요.", "stage": "학생 스스로 학습"}, {"title": "85쪽 4번 · 두 곱 확인", "body": "<div class=\"visual\">20 : 25 = 4 : 5</div><p>내항의 곱 <b>25 × 4</b>는?</p>", "answer": ["100"], "hint": "외항의 곱 20 × 5와 같은지 확인해요.", "solution": "100이에요. 두 곱 모두 100이에요.", "stage": "학생 스스로 학습"}, {"title": "이제 익힘 56~57쪽", "stage": "익힘 문제", "body": "<p>교과서에서 배운 성질로 익힘도 풀어요.</p><p><b>1~4번은 기본 연습</b>,<br><b>5~7번은 시간이 남으면 도전</b>해요.</p><p>답은 먼저 보여 주지 않아요.<br>직접 입력한 뒤 확인해요.</p><p>33분이 되면 공책 정리로 이동해요.<br>못 끝낸 문제는 표시해 두고 선생님께 알려요.</p>"}, {"title": "익힘 56쪽 1번 · 외항의 곱", "body": "<div class=\"visual\">2 : 5 = 6 : 15</div><p>외항의 곱 2 × 15를 구해요.</p>", "answer": ["30"], "hint": "양 끝을 곱해요.", "solution": "30이에요. 외항의 곱 식에 15와 30을 써요.", "stage": "익힘 문제"}, {"title": "익힘 56쪽 1번 · 내항의 곱", "body": "<div class=\"visual\">2 : 5 = 6 : 15</div><p>내항의 곱 5 × 6을 구해요.</p>", "answer": ["30"], "hint": "가운데 두 수를 곱해요.", "solution": "30이에요. 내항의 곱 식에 6과 30을 써요.", "stage": "익힘 문제"}, {"title": "익힘 56쪽 1번 · 같은가요?", "body": "<p>외항의 곱과 내항의 곱은<br><b>같습니다</b>, <b>다릅니다</b> 중 어느 쪽인가요?</p>", "answer": ["같습니다", "같다"], "hint": "앞에서 계산한 두 값을 비교해요.", "solution": "같습니다에 ○를 해요.", "stage": "익힘 문제"}, {"title": "익힘 56쪽 2번 · 아는 곱부터", "body": "<div class=\"visual\">4 : 7 = 12 : □</div><p>내항의 곱 7 × 12를 구해요.</p>", "answer": ["84"], "hint": "7 × 10에 7 × 2를 더해요.", "solution": "내항의 곱은 84예요.", "stage": "익힘 문제"}, {"title": "익힘 56쪽 2번 · 빈칸 구하기", "body": "<div class=\"visual\">4 : 7 = 12 : □</div><p>외항의 곱도 84예요.<br>4 × □ = 84에서 □는?</p>", "answer": ["21"], "hint": "84 ÷ 4를 계산해요.", "solution": "21이에요. 익힘의 계산 과정은 4 × □ = 7 × 12, 4 × □ = 84, □ = 21로 완성해요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 3번 · 첫 식 확인", "body": "<div class=\"visual\">9 : 2 = 54 : 12</div><p>9 × 12와 2 × 54를 계산해요.<br>두 곱이 같으면 <b>같다</b>, 아니면 <b>다르다</b>를 써요.</p>", "answer": ["같다"], "hint": "양 끝의 곱과 가운데의 곱을 비교해요.", "solution": "두 곱은 모두 108이에요. 비례식이므로 익힘에 ○를 해요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 3번 · 소수도 확인", "body": "<div class=\"visual\">0.7 : 1.3 = 14 : 26</div><p>0.7 × 26과 1.3 × 14를 계산해요.<br>두 곱이 <b>같다</b> 또는 <b>다르다</b>를 써요.</p>", "answer": ["같다"], "hint": "7 × 26과 13 × 14를 먼저 계산하고 각각 10으로 나눠요.", "solution": "두 곱은 모두 18.2예요. 비례식이므로 ○를 해요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 3번 · 분수도 확인", "body": "<div class=\"visual\"><span class=\"frac\"><span>1</span><span>6</span></span> : <span class=\"frac\"><span>2</span><span>3</span></span> = 3 : 2</div><p>외항의 곱은 <span class=\"frac\"><span>1</span><span>6</span></span> × 2,<br>내항의 곱은 <span class=\"frac\"><span>2</span><span>3</span></span> × 3이에요.</p><p>두 곱이 <b>같다</b> 또는 <b>다르다</b>를 써요.</p>", "answer": ["다르다"], "hint": "분수에 자연수를 곱할 때는 분자에 곱해요.", "solution": "외항의 곱은 1/3, 내항의 곱은 2예요. 다르므로 비례식이 아니에요. ○를 하지 않아요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 4번 · 첫 번째 아는 곱", "body": "<div class=\"visual\">11 : 2 = □ : 8</div><p>외항의 곱 11 × 8은?</p>", "answer": ["88"], "hint": "양 끝을 곱해요.", "solution": "외항의 곱은 88이에요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 4번 · 첫 빈칸", "body": "<div class=\"visual\">11 : 2 = □ : 8</div><p>2 × □ = 88에서 □는?</p>", "answer": ["44"], "hint": "88 ÷ 2를 계산해요.", "solution": "44예요. 익힘에 11 : 2 = 44 : 8을 완성해요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 4번 · 두 번째 아는 곱", "body": "<div class=\"visual\">5 : 9 = 30 : □</div><p>내항의 곱 9 × 30은?</p>", "answer": ["270"], "hint": "가운데 두 수를 곱해요.", "solution": "내항의 곱은 270이에요.", "stage": "익힘 문제"}, {"title": "익힘 57쪽 4번 · 두 번째 빈칸", "body": "<div class=\"visual\">5 : 9 = 30 : □</div><p>5 × □ = 270에서 □는?</p>", "answer": ["54"], "hint": "270 ÷ 5를 계산해요.", "solution": "54예요. 익힘에 5 : 9 = 30 : 54를 완성해요.", "stage": "익힘 문제"}, {"title": "선택 · 익힘 57쪽 5번 ㉠", "body": "<div class=\"visual\">3 : □ = 5 : 10</div><p>3 × 10 = 5 × □예요.<br>빈칸을 구해요.</p>", "answer": ["6"], "hint": "30 ÷ 5를 계산해요.", "solution": "㉠의 빈칸은 6이에요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 익힘 57쪽 5번 ㉡", "body": "<div class=\"visual\">1.4 : 0.6 = □ : 3</div><p>1.4 × 3 = 0.6 × □예요.<br>빈칸을 구해요.</p>", "answer": ["7"], "hint": "4.2 ÷ 0.6을 계산해요. 두 수에 10을 곱하면 42 ÷ 6이에요.", "solution": "㉡의 빈칸은 7이에요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 익힘 57쪽 5번 비교", "body": "<p>앞에서 구한 두 빈칸을 비교해요.<br>더 큰 쪽의 기호 <b>㉠ 또는 ㉡</b>을 써요.</p>", "answer": ["㉡", "ㄴ"], "hint": "앞의 두 화면에서 구한 답을 비교해요.", "solution": "㉠은 6, ㉡은 7이므로 더 큰 쪽은 ㉡이에요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 익힘 57쪽 6번 ㉠", "body": "<div class=\"visual\">7 : 3 = ㉠ : ㉡</div><p>내항의 곱은 84예요.<br>3 × ㉠ = 84에서 ㉠은?</p>", "answer": ["28"], "hint": "84 ÷ 3을 계산해요.", "solution": "㉠은 28이에요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 익힘 57쪽 6번 ㉡", "body": "<div class=\"visual\">7 : 3 = 28 : ㉡</div><p>외항의 곱도 84예요.<br>7 × ㉡ = 84에서 ㉡은?</p>", "answer": ["12"], "hint": "84 ÷ 7을 계산해요.", "solution": "㉡은 12예요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 익힘 57쪽 카드 문제", "body": "<p>카드: <b>2, 3, 4, 6, 8, 9, 12, 16</b></p><p>서로 다른 카드 4장을 한 번씩 써서<br>비례식을 만들어 입력해요.</p>", "answer": ["2:3=4:6", "2:3=6:9", "2:3=8:12", "2:4=3:6", "2:4=6:12", "2:4=8:16", "2:6=3:9", "2:6=4:12", "2:8=3:12", "2:8=4:16", "3:2=6:4", "3:2=9:6", "3:2=12:8", "3:4=6:8", "3:4=9:12", "3:4=12:16", "3:6=2:4", "3:6=4:8", "3:6=8:16", "3:8=6:16", "3:9=2:6", "3:9=4:12", "3:12=2:8", "3:12=4:16", "4:2=6:3", "4:2=12:6", "4:2=16:8", "4:3=8:6", "4:3=12:9", "4:3=16:12", "4:6=2:3", "4:6=8:12", "4:8=3:6", "4:8=6:12", "4:12=2:6", "4:12=3:9", "4:16=2:8", "4:16=3:12", "6:2=9:3", "6:2=12:4", "6:3=4:2", "6:3=8:4", "6:3=16:8", "6:4=3:2", "6:4=12:8", "6:8=3:4", "6:8=9:12", "6:8=12:16", "6:9=2:3", "6:9=8:12", "6:12=2:4", "6:12=4:8", "6:12=8:16", "6:16=3:8", "8:2=12:3", "8:2=16:4", "8:3=16:6", "8:4=6:3", "8:4=12:6", "8:6=4:3", "8:6=12:9", "8:6=16:12", "8:12=2:3", "8:12=4:6", "8:12=6:9", "8:16=2:4", "8:16=3:6", "8:16=6:12", "9:3=6:2", "9:3=12:4", "9:6=3:2", "9:6=12:8", "9:12=3:4", "9:12=6:8", "12:3=8:2", "12:3=16:4", "12:4=6:2", "12:4=9:3", "12:6=4:2", "12:6=8:4", "12:6=16:8", "12:8=3:2", "12:8=6:4", "12:8=9:6", "12:9=4:3", "12:9=8:6", "12:16=3:4", "12:16=6:8", "16:4=8:2", "16:4=12:3", "16:6=8:3", "16:8=4:2", "16:8=6:3", "16:8=12:6", "16:12=4:3", "16:12=8:6"], "hint": "한 비의 앞뒤에 같은 수를 곱해서 두 번째 비를 만들어 봐요. 두 곱도 확인해요.", "solution": "카드를 중복하지 않고 두 곱이 같게 만들었어요. 내가 만든 식을 익힘에도 써요.", "stage": "익힘 문제 · 선택"}, {"title": "선택 · 카드 문제 방법 쓰기", "body": "<p>방금 만든 비례식을 어떻게 만들었나요?<br><b>익힘의 방법 칸에도</b> 설명을 써요.</p>", "answer": ["설명"], "hint": "앞뒤에 같은 수를 곱한 방법이나 두 곱이 같음을 확인한 방법을 써요.", "solution": "설명 예: 앞뒤에 같은 수를 곱해 비율이 같은 비를 만들었습니다. 또는 외항의 곱과 내항의 곱이 같도록 카드를 골랐습니다. 내 식에 맞는 계산도 적고 선생님께 확인받아요.", "stage": "익힘 문제 · 선택", "kind": "explanation"}, {"title": "공책 필기 ① 오늘의 성질", "body": "<div class=\"note\">비례식의 성질<br><br>비례식에서<br>외항의 곱과 내항의 곱은 같다.<br><br>1 : 4 = 6 : 24<br>외항의 곱: 1 × 24 = 24<br>내항의 곱: 4 × 6 = 24</div><p>실제 공책에 써요.</p>", "stage": "공책 필기"}, {"title": "공책 필기 ② 이유와 풀이 순서", "body": "<div class=\"note\">같은 배수로 비례식을 만들면,<br>두 곱은 같은 수들을 순서만 바꿔 곱한다.<br><br>빈칸 구하기<br>① 아는 두 수의 곱을 구한다.<br>② 다른 두 수의 곱도 같게 만든다.<br>③ 나눗셈으로 빈칸을 구한다.<br>④ 답을 넣어 두 곱을 확인한다.</div><p>공책에 쓰고, 가장 헷갈린 부분에 표시해요.</p>", "stage": "공책 필기"}, {"title": "교과서와 공책 검사받기", "body": "<p><b>교과서 84~85쪽, 익힘 56~57쪽과 공책을 펼쳐요.</b></p><p>선생님께 말해요.<br>“비례식에서 외항의 곱과 내항의 곱은 같아요.”</p><p>85쪽 3번에서 내가 구한 답을 보여 드리고,<br>어떤 곱을 먼저 구했는지 설명해요.</p><p>어려웠던 곳을 질문하고, 고친 뒤 다시 확인받아요.</p><label><input id=\"inspected\" type=\"checkbox\"> 선생님께 검사받았어요.</label>", "stage": "선생님 검사"}];const key='proportion-property-84-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch(e){}let page=Number.isInteger(state.page)?Math.max(0,Math.min(state.page,slides.length-1)):0;let saveTimer=null;let lastSaved='';function flushSave(){clearTimeout(saveTimer);saveTimer=null;try{const snapshot=JSON.stringify(state);if(snapshot!==lastSaved){localStorage.setItem(key,snapshot);lastSaved=snapshot}document.querySelector('#save').textContent='자동 저장됨 · 같은 브라우저에서 이어 공부할 수 있어요.'}catch(e){document.querySelector('#save').textContent='자동 저장을 사용할 수 없어요. 공부 기록을 내려받아 보관해요.'}}function save(){state.page=page;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,500)}window.addEventListener('pagehide',flushSave);document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave()});function mathText(el,text){text.split(/(\d+\/\d+)/g).forEach(part=>{if(/^\d+\/\d+$/.test(part)){const f=document.createElement('span');f.className='frac';const pair=part.split('/');pair.forEach(v=>{const sp=document.createElement('span');sp.textContent=v;f.append(sp)});el.append(f)}else el.append(document.createTextNode(part))})}function normalize(v){return v.replace(/\s/g,'').replace(/[，、]/g,',').replace(/：/g,':').replace(/＝/g,'=')}function render(){const s=slides[page];const card=document.querySelector('#card');card.innerHTML='<h1></h1>'+s.body;card.querySelector('h1').textContent=s.title;document.querySelector('#stage').textContent=s.stage;document.querySelector('#page').textContent=(page+1)+' / '+slides.length;document.querySelector('#progress').max=slides.length;document.querySelector('#progress').value=page+1;document.querySelector('#prev').disabled=page===0;document.querySelector('#next').disabled=page===slides.length-1;if(s.answer){const box=document.createElement('div');let inputs=[];if(s.fraction){box.className='fracinput';for(let i=0;i<2;i++){const input=document.createElement('input');input.inputMode='numeric';input.placeholder=i?'분모':'분자';input.setAttribute('aria-label',i?'분모':'분자');input.value=(state['q'+page]||'').split('/')[i]||'';inputs.push(input);box.append(input);if(i===0){const bar=document.createElement('div');bar.className='bar';box.append(bar)}}}else{const input=document.createElement('input');input.autocomplete='off';input.spellcheck=false;input.className='answer';input.placeholder='답을 입력해요';input.setAttribute('aria-label','답');input.value=state['q'+page]||'';inputs=[input];box.append(input)}const get=()=>inputs.map(i=>i.value.trim()).join(s.fraction?'/':'');const hint=document.createElement('details');const summary=document.createElement('summary');summary.textContent='도움이 필요해요 · 힌트';const hp=document.createElement('p');mathText(hp,s.hint);hint.append(summary,hp);const check=document.createElement('button');check.textContent=s.kind==='explanation'?'내 설명과 비교':'내 답 확인';const feedback=document.createElement('div');feedback.id='feedback';feedback.setAttribute('role','status');inputs.forEach(i=>i.oninput=()=>{state['q'+page]=get();save();feedback.replaceChildren()});check.onclick=()=>{if(inputs.some(i=>!i.value.trim())){feedback.textContent='빈칸에 답을 적어 봐요.';return}if(s.kind==='explanation'){feedback.replaceChildren();mathText(feedback,s.solution);save();return}if(s.answer.some(a=>normalize(a)===normalize(get()))){feedback.replaceChildren();mathText(feedback,'✓ 잘했어요! '+s.solution);state['ok'+page]=true;save()}else{feedback.textContent='괜찮아요. 힌트를 보고 다시 해 봐요.';state['ok'+page]=false;save();const d=document.createElement('details');const sum=document.createElement('summary');sum.textContent='풀이를 함께 읽어요';const p=document.createElement('p');mathText(p,s.solution);d.append(sum,p);feedback.append(d)}};card.append(box,hint,check,feedback)}const inspected=card.querySelector('#inspected');if(inspected){inspected.checked=!!state.inspected;inspected.onchange=()=>{state.inspected=inspected.checked;save()}}save()}function move(n){page=Math.max(0,Math.min(n,slides.length-1));render();window.scrollTo({top:0,behavior:'instant'})}document.querySelector('#next').onclick=()=>move(page+1);document.querySelector('#prev').onclick=()=>move(page-1);document.querySelector('#student').onclick=()=>move(slides.findIndex(s=>s.stage==='학생 스스로 학습'));document.querySelector('#workbook').onclick=()=>move(slides.findIndex(s=>s.stage==='익힘 문제'));document.querySelector('#notebook').onclick=()=>move(slides.findIndex(s=>s.stage==='공책 필기'));document.querySelector('#reset').onclick=()=>{if(confirm('저장된 공부 기록을 지우고 처음부터 시작할까요?')){state={};move(0)}};document.querySelector('#download').onclick=()=>{const lines=['비례식 공부 기록'];slides.forEach((s,i)=>{if(s.answer)lines.push(s.title+': '+(state['q'+i]||'미입력')+(state['ok'+i]?' (정답 확인)':''))});lines.push('선생님 검사: '+(state.inspected?'완료 표시':'미검사'));const u=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='비례식_공부기록.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};render();</script></html>
